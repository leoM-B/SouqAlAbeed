<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - سوق العبيد</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <!-- شريط التنقل -->
    <nav>
        <ul>
            <li><a href="index.html">الصفحة الرئيسية</a></li>
            <li><a href="about.html">من نحن</a></li>
            <li><a href="cart.html">السلة</a></li>
            <li class="cart">
                <span id="cart-count">0</span>
                <img src="images/cart-icon.png" alt="أيقونة السلة">
            </li>
        </ul>
    </nav>

    <!-- الرأس -->
    <header>
        <img src="images/logo.jpg" alt="شعار سوق العبيد">
        <h1>سوق العبيد</h1>
    </header>

    <!-- القسم الرئيسي -->
    <main>
        <section class="product-details">
            <h2>تفاصيل المنتج</h2>
            <div class="details-container">
                <img id="product-image" src="images/placeholder.jpg" alt="صورة المنتج">
                <div class="details-text">
                    <h3 id="product-name">اسم المنتج</h3>
                    <p id="product-price" class="price">السعر: غير معروف</p>
                    <p id="product-description" class="description">
                        جارٍ تحميل الوصف...
                    </p>
                    <button id="add-to-cart" class="btn">أضف إلى السلة</button>
                    <p id="cart-message" class="cart-message"></p>
                    <a href="index.html" class="btn">العودة إلى الصفحة الرئيسية</a>
                </div>
            </div>
        </section>
    </main>

    <!-- التذييل -->
    <footer>
        <p>© 2025 سوق العبيد - مقلب لضو الطحان والبقية! تحية من إياد</p>
        <div class="social-links">
            <a href="#" class="social-icon"><img src="images/twitter-icon.png" alt="تويتر"></a>
            <a href="#" class="social-icon"><img src="images/facebook-icon.png" alt="فيسبوك"></a>
            <a href="#" class="social-icon"><img src="images/instagram-icon.png" alt="إنستغرام"></a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
